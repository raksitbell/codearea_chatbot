name: codearea-chatbot

services:
  ollama:
    image: ollama/ollama:0.32.0
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  ollama-data:
